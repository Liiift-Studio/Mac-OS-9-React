name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

# Trusted publishing: GitHub mints a short-lived OIDC token for this workflow
# and npm verifies it against the trusted publisher registered on the package.
# There is no NPM_TOKEN any more — the secret that used to be here expired
# silently and three releases failed with `E404 ... PUT` before anyone noticed,
# because npm answers an unauthorized publish with 404 rather than 403 to avoid
# leaking whether a package exists. A credential that cannot expire cannot do
# that. It also gets us provenance attestation for free.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14 or newer. (It also has to be
          # 20+ regardless: on 18 the test run died inside jsdom's dependency
          # chain — a require() of an ES module — failing this workflow for
          # reasons that had nothing to do with the package being published.)
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10, and OIDC publishing landed in 11.5.1.
      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      # Whether to publish is decided by comparing the manifest version to what
      # is actually on the registry. The previous condition matched the words
      # "version" or "release" anywhere in the commit message, which would
      # eventually publish a commit that merely mentioned them, and skip a real
      # release whose message did not.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.should_publish }}" = "true" ]; then
            echo "Published ${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: ${{ steps.check.outputs.version }} is already on npm." >> "$GITHUB_STEP_SUMMARY"
          fi
